name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "7.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        env:
          Twilio_TwilioOptions__AccountSid: ${{secrets.TwilioOptions__AccountSid}}
          Twilio_TwilioOptions__AuthToken: ${{secrets.TwilioOptions__AuthToken}}
          Twilio_TwilioOptions__PhoneNumber: ${{secrets.TwilioOptions__PhoneNumber}}
        run: dotnet test --no-restore --verbosity normal
